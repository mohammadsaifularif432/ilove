<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Love You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #c471ed);
            color: white;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;
        }

        /* Judul */
        .title {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 5px 20px rgba(0,0,0,0.3);

            animation: fadeDown 1.5s ease;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 25px;
            opacity: 0.95;

            animation: fadeUp 2s ease;
        }

        /* Foto */
        .photo {
            margin: 20px 0;
            animation: photoAppear 2s ease;
        }

        .photo img {
            width: 160px;
            height: 160px;

            object-fit: cover;
            border-radius: 50%;

            border: 5px solid white;

            box-shadow:
                0 0 20px rgba(255,255,255,0.8),
                0 0 50px rgba(255,105,180,0.8);

            transition: 0.5s;
            cursor: pointer;
        }

        .photo img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* Love besar */
        .heart {
            font-size: 100px;

            animation: heartbeat 1.2s infinite;

            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.25));

            cursor: pointer;
            user-select: none;
        }

        /* Pesan */
        .message {
            font-size: 20px;
            min-height: 30px;
            margin-bottom: 20px;
        }

        /* Tombol */
        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            border: none;
            padding: 13px 22px;

            border-radius: 30px;

            background: rgba(255,255,255,0.2);
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255,255,255,0.5);

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-4px) scale(1.05);
            background: rgba(255,255,255,0.35);

            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;
            bottom: -50px;

            font-size: 25px;

            animation: floatUp linear forwards;

            pointer-events: none;
        }

        /* Popup */
        .popup {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.55);

            display: none;
            justify-content: center;
            align-items: center;

            z-index: 100;
        }

        .popup-box {
            width: 90%;
            max-width: 400px;

            padding: 30px;

            border-radius: 25px;

            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3
            );

            text-align: center;

            box-shadow: 0 20px 60px rgba(0,0,0,0.4);

            animation: popupShow 0.5s ease;
        }

        .popup-box h2 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        .popup-box p {
            line-height: 1.7;
            margin-bottom: 20px;
        }

        /* Music */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;

            z-index: 20;
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            font-size: 18px;

            animation: sparkle 2s infinite;
        }

        /* Animations */

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    translateX(100px)
                    rotate(360deg);

                opacity: 0;
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes photoAppear {
            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes popupShow {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* HP */
        @media (max-width: 600px) {

            .title {
                font-size: 30px;
            }

            .subtitle {
                font-size: 16px;
            }

            .heart {
                font-size: 80px;
            }

            .photo img {
                width: 130px;
                height: 130px;
            }

            button {
                padding: 11px 17px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    

    <!-- Musik -->
    <div class="music-player">
        <button onclick="toggleMusic()" id="musicButton">
            🎵 Putar Musik
        </button>
    </div>

    <!-- File musik -->
    <audio id="music" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>


    <!-- Background -->
    <div class="background" id="background"></div>


    <!-- Isi -->
    <div class="container">

        <div class="heart" onclick="heartExplosion()">
            ❤️
        </div>

        <h1 class="title">
            I Love You Rifda ❤️
        </h1>

        <p class="subtitle">
            Selalu semangat yaa sayang 🥰
        </p>


        <!-- Foto -->
        <div class="photo">
    <img 
        src="./arif.jpeg" 
        alt="Foto"
        onclick="photoClick()"
    >
</div>


        <!-- Tulisan berjalan -->
        <div class="message" id="message"></div>


        <!-- Tombol -->
        <div class="buttons">

            <button onclick="openMessage()">
                💌 Buka Pesan
            </button>

            <button onclick="heartExplosion()">
                💖 Klik disini
            </button>

            <button onclick="surprise()">
                🎁 surprise
            </button>

        </div>

    </div>


    <!-- Popup -->
    <div class="popup" id="popup">

        <div class="popup-box">

            <h2>
                Untuk Rifdahasna ❤️
            </h2>

            <p>
                Kamu adalah salah satu alasan
                kenapa hari-hariku terasa lebih indah.
                <br><br>

                Tetap semangat yaa sayang.
                Jangan pernah menyerah.
                <br><br>

                I LOVE YOU ❤️🥰
            </p>

            <button onclick="closeMessage()">
                ❤️ Tutup
            </button>

        </div>

    </div>


    <script>

        /* =========================
           MUSIK
        ========================= */

        const music = document.getElementById("music");
        const musicButton = document.getElementById("musicButton");

        function toggleMusic() {

            if (music.paused) {

                music.play();

                musicButton.innerHTML =
                    "⏸️ Pause Musik";

            } else {

                music.pause();

                musicButton.innerHTML =
                    "🎵 Putar Musik";
            }
        }


        /* =========================
           TULISAN BERJALAN
        ========================= */

        const text =
            "Semoga kita selalu bersama sampai kapanpun ❤️";

        let index = 0;

        function typeWriter() {

            if (index < text.length) {

                document.getElementById("message")
                    .innerHTML += text.charAt(index);

                index++;

                setTimeout(typeWriter, 70);
            }
        }

        typeWriter();


        /* =========================
           FLOATING HEART
        ========================= */

        const emojis = [
            "❤️",
            "💕",
            "💗",
            "💖",
            "💘",
            "💝",
            "✨",
            "🌹"
        ];

        function createHeart() {

            const heart =
                document.createElement("div");

            heart.className = "floating-heart";

            heart.innerHTML =
                emojis[
                    Math.floor(
                        Math.random() * emojis.length
                    )
                ];

            heart.style.left =
                Math.random() * 100 + "%";

            heart.style.fontSize =
                (15 + Math.random() * 30) + "px";

            heart.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            document
                .getElementById("background")
                .appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 9000);
        }

        setInterval(createHeart, 500);


        /* =========================
           HEART EXPLOSION
        ========================= */

        function heartExplosion() {

            for (let i = 0; i < 25; i++) {

                const heart =
                    document.createElement("div");

                heart.innerHTML =
                    emojis[
                        Math.floor(
                            Math.random() * emojis.length
                        )
                    ];

                heart.style.position = "fixed";

                heart.style.left = "50%";
                heart.style.top = "50%";

                heart.style.fontSize =
                    (15 + Math.random() * 30) + "px";

                heart.style.zIndex = "999";

                heart.style.pointerEvents = "none";

                const x =
                    (Math.random() - 0.5) * 600;

                const y =
                    (Math.random() - 0.5) * 600;

                heart.animate(
                    [
                        {
                            transform:
                                "translate(-50%, -50%) scale(0)",
                            opacity: 1
                        },

                        {
                            transform:
                                `translate(${x}px, ${y}px) scale(1.5)`,
                            opacity: 0
                        }
                    ],
                    {
                        duration: 1200,
                        easing: "ease-out"
                    }
                );

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 1200);
            }
        }


        /* =========================
           POPUP
        ========================= */

        function openMessage() {

            document.getElementById("popup")
                .style.display = "flex";

            heartExplosion();
        }

        function closeMessage() {

            document.getElementById("popup")
                .style.display = "none";
        }


        /* =========================
           FOTO
        ========================= */

        function photoClick() {

            alert(
                "Foto yang sangat cantik ❤️🥰"
            );

            heartExplosion();
        }


        /* =========================
           KEJUTAN
        ========================= */

        function surprise() {

            const messages = [

                "Aku sayang kamu ❤️",

                "Jangan lupa senyum hari ini 🥰",

                "Kamu sangat berarti buat aku 💕",

                "Semangat terus yaa sayang 🌹",

                "I Love You Rifda ❤️❤️❤️"

            ];

            const random =
                messages[
                    Math.floor(
                        Math.random() * messages.length
                    )
                ];

            alert(random);

            heartExplosion();
        }


        /* =========================
           KLIK DI LAYAR
        ========================= */

        document.addEventListener(
            "click",
            function(event) {

                if (
                    event.target.tagName === "BUTTON" ||
                    event.target.tagName === "IMG"
                ) {
                    return;
                }

                const heart =
                    document.createElement("div");

                heart.innerHTML = "❤️";

                heart.style.position = "fixed";

                heart.style.left =
                    event.clientX + "px";

                heart.style.top =
                    event.clientY + "px";

                heart.style.fontSize = "25px";

                heart.style.pointerEvents = "none";

                heart.style.zIndex = "999";

                heart.animate(
                    [
                        {
                            transform: "scale(0)",
                            opacity: 1
                        },

                        {
                            transform:
                                "translateY(-100px) scale(1.5)",
                            opacity: 0
                        }
                    ],
                    {
                        duration: 800
                    }
                );

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 800);

            }
        );

    </script>

</body>
</html>
